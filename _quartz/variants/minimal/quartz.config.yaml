# Generated by variants/make-configs.mjs for design variant "minimal" (E · Minimal).
# Do not edit by hand; edit variants/variants.mjs and rerun.
configuration:
  pageTitle: CoMPhy Lab blogs
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-GB
  baseUrl: blogs.comphy-lab.org
  ignorePatterns:
    - _quartz
    - _quartz/**
    - _scripts
    - _scripts/**
    - docs
    - docs/**
    - .github
    - .github/**
    - .pandoc
    - .pandoc/**
    - .obsidian
    - .trash
    - private
    - templates
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - Private-ToDo-Blog-public.md
    - publish.css
    - .Rhistory
    - .dbxignore
    - .gitattributes
    - .gitignore
  defaultDateType: created
  theme:
    fontOrigin: googleFonts
    cdnCaching: false
    typography:
      header: IBM Plex Sans
      body: IBM Plex Sans
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f3efe8"
        lightgray: "#e3ddd2"
        gray: "#857867"
        darkgray: "#1f1a15"
        dark: "#0f0c08"
        secondary: "#254c4a"
        tertiary: "#0056b3"
        highlight: rgba(37, 76, 74, 0.10)
        textHighlight: "#ffcf5c88"
      darkMode:
        light: "#12100d"
        lightgray: "#2a251f"
        gray: "#6e6455"
        darkgray: "#e6dfd0"
        dark: "#f8f4ec"
        secondary: "#6ac2bd"
        tertiary: "#8fb8ff"
        highlight: rgba(106, 194, 189, 0.14)
        textHighlight: "#ffcf5c55"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      maxDepth: 2
    order: 50
    layout:
      position: beforeBody
      priority: 40
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: mathjax
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: false
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        removeTags: []
        showTags: true
        enableRadial: false
      globalGraph:
