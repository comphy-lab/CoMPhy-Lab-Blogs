name: Blog site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: blog-verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _quartz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _quartz/package-lock.json
      - run: npm ci
      - name: Build and verify site, PDFs, and browser interactions
        run: npm run build:cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: _quartz/output/playwright/
      - uses: actions/upload-artifact@v4
        with:
          name: blog-site
          path: _quartz/public/
          include-hidden-files: true
          retention-days: 7
