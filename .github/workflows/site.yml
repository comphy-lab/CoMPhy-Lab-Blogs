name: Blog site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: blog-verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _quartz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _quartz/package-lock.json
      - run: npm ci
      - run: npm run plugins:restore
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test every page through Cloudflare routing
        run: |
          set -euo pipefail
          npm run preview > /tmp/blog-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          preview_ready=false
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8790/ -o /dev/null; then
              preview_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$preview_ready" != true ]]; then
            echo "Cloudflare preview did not become ready within 60 seconds"
            cat /tmp/blog-preview.log
            exit 1
          fi
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: _quartz/output/playwright/
      - uses: actions/upload-artifact@v4
        with:
          name: blog-site
          path: _quartz/public/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    concurrency:
      group: blog-deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: _quartz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _quartz/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: blog-site
          path: _quartz/public
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
